spring.application.name=online-grocery-backend-test

# In-memory H2 Database for automated tests (MySQL mode)
spring.datasource.url=jdbc:h2:mem:online_grocery_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret (Base64 encoded 256-bit key)
app.jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItYXV0b21hdGVkLXRlc3RzLTEyMzQ1Njc4OTA=
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173
